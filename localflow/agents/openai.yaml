interface:
  display_name: "Localflow"
  short_description: "本地环境检查、MR 创建、清理、提交与推送流程"
  default_prompt: "Use $localflow for this repo change: run `$localflow check` when local CLI/auth/permission capability matters, `$localflow mr` to create or inspect the current branch MR/PR, `$localflow clean` only after the MR/PR is merged, otherwise clarify unclear requirements first, default to an isolated task worktree, verify, commit, and push safely."
