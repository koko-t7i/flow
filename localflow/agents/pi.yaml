interface:
  display_name: "Localflow"
  short_description: "本地仓库 flow skill"
  default_prompt: "Use /localflow as a repository flow skill: understand, orient, implement, verify, and report. Assign agents, use linked worktrees, sync ignored env files, commit, deliver, and clean up only when the task needs them. Keep the original checkout on its environment branch when using worktrees. Create feature or delivery branches only inside linked worktrees when needed. Use minimal repo checks. Protect secrets. Ask before destructive git actions."
